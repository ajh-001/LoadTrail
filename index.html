    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .drawing-cursor .leaflet-interactive { cursor: crosshair !important; }
        
        /* SVG Icon Utility */
        .svg-icon { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        /* Custom User Location Live Marker */
        .user-location-marker { position: relative; }
        .user-location-pulse {
            background-color: rgba(66, 133, 244, 0.4);
            width: 30px; height: 30px; border-radius: 50%; position: absolute;
            top: 0; left: 0; animation: pulse 2s infinite; z-index: 1;
        }
        .user-location-dot {
            background-color: #4285F4;
            width: 14px; height: 14px; border-radius: 50%; border: 2px solid white;
            box-shadow: 0 0 4px rgba(0,0,0,0.4); position: absolute;
            top: 8px; left: 8px; z-index: 3;
        }
        .user-location-heading {
            width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 14px solid rgba(66, 133, 244, 0.9);
            position: absolute; top: -2px; left: 50%; transform-origin: 50% 17px; z-index: 2;
        }
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Sidebar Toggle Transitions */
        #sidebar { transition: height 0.3s ease, width 0.3s ease; }
        .sidebar-content { transition: opacity 0.2s ease, visibility 0.2s ease; }
        @media (max-width: 767px) {
            #sidebar { width: 100%; }
            #sidebar.collapsed { height: 0 !important; }
            #sidebar.collapsed .sidebar-content { opacity: 0; visibility: hidden; height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; }
            #sidebarIcon { transform: rotate(0deg); }
            #sidebar.collapsed #sidebarIcon { transform: rotate(180deg); }
        }
        @media (min-width: 768px) {
            #sidebar { height: 100%; width: 20rem; }
            #sidebar.collapsed { width: 0 !important; }
            #sidebar.collapsed .sidebar-content { opacity: 0; visibility: hidden; width: 0; padding-left: 0; padding-right: 0; overflow: hidden; }
            #sidebarIcon { transform: rotate(-90deg); }
            #sidebar.collapsed #sidebarIcon { transform: rotate(90deg); }
        }

        #customAlert { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; }
    </style>
</head>
<body class="flex flex-col md:flex-row h-[100dvh] bg-gray-50 overflow-hidden">

                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 text-center">Adjust Position</h3>

                        <div></div>

                        <button id="btnScaleUp" class="flex-1 bg-white border border-gray-300 p-2 rounded hover:bg-gray-100 text-gray-700 transition touch-manipulation flex items-center justify-center"><svg class="svg-icon"><use href="#icon-plus"></use></svg></button>

                        <button id="btnRotRight" class="flex-1 bg-white border border-gray-300 p-2 rounded hover:bg-gray-100 text-gray-700 transition touch-manipulation flex items-center justify-center"><svg class="svg-icon"><use href="#icon-rotate-right"></use></svg></button>

            <!-- Step 2: Draw -->

                        Download .GPX

        <!-- Toggle Handle -->
        <button id="sidebarHandle" class="absolute left-1/2 md:left-auto -bottom-6 md:bottom-auto -translate-x-1/2 md:translate-x-0 md:top-1/2 md:-right-6 md:-translate-y-1/2 w-12 h-6 md:w-6 md:h-12 bg-white border border-gray-200 shadow-md flex items-center justify-center z-[2001] rounded-b-md md:rounded-b-none md:rounded-r-md text-gray-500 hover:text-blue-600 transition-colors focus:outline-none">

    <!-- Map Container -->
    <div id="map" class="flex-grow relative z-10">
        <!-- Live Location Floating Button -->
        <button id="locateBtn" class="absolute top-[90px] right-2.5 z-[1000] bg-white w-[34px] h-[34px] rounded-md shadow-[0_1px_5px_rgba(0,0,0,0.4)] border border-[#ccc] flex items-center justify-center text-gray-700 hover:bg-[#f4f4f4] transition touch-manipulation" title="Track My Location">
            <svg class="svg-icon w-5 h-5"><use href="#icon-locate"></use></svg>
        </button>

        <div id="mapInstructionOverlay" class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-6 py-3 rounded-full shadow-lg z-[1000] font-bold pointer-events-none text-center w-11/12 max-w-md">
            <span id="mapInstructionText">Click map to place image center.</span>
        </div>

        <!-- Crosshair visual center -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-50 z-[1000]">
            <svg class="svg-icon text-gray-600 w-6 h-6"><use href="#icon-plus"></use></svg>
        </div>

    <script>
        // --- 1. PWA INSTALLATION & INLINE SERVICE WORKER ---
        const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => {
                e.respondWith(fetch(e.request).catch(() => new Response('App Offline', { headers: { 'Content-Type': 'text/plain' } })));
            });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Registration failed:', err));
        }

        let deferredPrompt;
        const installAppBtn = document.getElementById('installAppBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installAppBtn.classList.remove('hidden');
        });

        installAppBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installAppBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        // --- 2. CUSTOM LEAFLET OVERLAY (Replaces MutationObserver) ---
        L.RotatedImageOverlay = L.ImageOverlay.extend({
            options: { angle: 0 },
            setAngle: function(angle) {
                this.options.angle = angle;
                this._applyRotation();
            },
            _reset: function() {
                L.ImageOverlay.prototype._reset.call(this);
                this._applyRotation();
            },
            _applyRotation: function() {
                if (!this._image) return;
                let t = this._image.style.transform;
                t = t.replace(/\s*rotate\([^)]+\)/g, ''); // Strip existing
                this._image.style.transform = t + ' rotate(' + (this.options.angle || 0) + 'deg)';
                this._image.style.transformOrigin = 'center center';
            }
        });

        function showAlert(msg) {
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('customAlert').style.display = 'flex';
            setTimeout(() => document.getElementById('customAlert').style.display = 'none', 6000);
        }

        // --- 3. APP INITIALIZATION ---
        window.onload = function() {
            // Use Canvas Renderer for high-performance trails
            const map = L.map('map', { zoomControl: false, renderer: L.canvas() }).setView([52.2, -0.6], 5);
            L.control.zoom({ position: 'topright' }).addTo(map);

            const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri' });
            const openStreetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' });
            const topoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: 'SRTM | OpenTopoMap' });

            esriSatellite.addTo(map);
            L.control.layers({ "Satellite": esriSatellite, "Topo Map": topoMap, "Street Map": openStreetMap }, null, {position: 'bottomleft'}).addTo(map);

            // State
            let imageOverlay = null;
            let isPlacingImage = false;
            let imgCenter = null;
            let imgWidthLng = 0;
            let imgHeightLat = 0;
            let imgRotation = 0;
            let calImgObj = new Image();

            let isDrawing = false;
            let trailCoords = [];
            let trailPolyline = L.polyline([], { color: '#ff0000', weight: 4, opacity: 0.8 }).addTo(map);
            let pointMarkers = L.layerGroup().addTo(map);

            let isTracking = false;
            let userMarker = null;
            let userAccuracyCircle = null;

            // DOM Cache
            const ui = {
                drawToggleBtn: document.getElementById('drawToggleBtn'),
                drawIcon: document.getElementById('drawIcon'),
                drawText: document.getElementById('drawText'),
                undoBtn: document.getElementById('undoBtn'),
                clearTrailBtn: document.getElementById('clearTrailBtn'),
                pointCountTxt: document.getElementById('pointCount'),
                exportGpxBtn: document.getElementById('exportGpxBtn'),
                exportKmlBtn: document.getElementById('exportKmlBtn'),
                locateBtn: document.getElementById('locateBtn'),
                opacitySlider: document.getElementById('opacitySlider'),
                opacityVal: document.getElementById('opacityVal'),
                removeOverlayBtn: document.getElementById('removeOverlayBtn'),
                overlayControls: document.getElementById('overlayControls'),
                mapInstructionOverlay: document.getElementById('mapInstructionOverlay'),
                mapInstructionText: document.getElementById('mapInstructionText'),
                mapEl: document.getElementById('map')
            };

            // --- 4. IMAGE PLACEMENT LOGIC ---
            document.getElementById('imageUpload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    calImgObj.src = event.target.result;
                    calImgObj.onload = () => {
                        isPlacingImage = true;
                        if (imageOverlay) map.removeLayer(imageOverlay);
                        ui.mapInstructionText.innerHTML = "Click map to place image center.";
                        ui.mapInstructionOverlay.classList.remove('hidden');
                        ui.mapEl.classList.add('drawing-cursor');
                    };
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            });

            function updateOverlay() {
                if (!imageOverlay || !imgCenter) return;
                const halfW = imgWidthLng / 2;
                const halfH = imgHeightLat / 2;
                const bounds = L.latLngBounds(
                    [imgCenter.lat - halfH, imgCenter.lng - halfW],
                    [imgCenter.lat + halfH, imgCenter.lng + halfW]
                );
                imageOverlay.setBounds(bounds);
                imageOverlay.setAngle(imgRotation);
            }

            // High-performance hold listeners via requestAnimationFrame
            function addHoldListener(btnId, action) {
                const btn = document.getElementById(btnId);
                let reqId = null;
                let lastTime = 0;
                
                const loop = (time) => {
                    if (time - lastTime >= 40) { // ~25fps equivalent for smooth adjustments
                        action();
                        lastTime = time;
                    }
                    reqId = requestAnimationFrame(loop);
                };
                const start = (e) => {
                    if (e.type === 'touchstart' && e.cancelable) e.preventDefault();
                    if (!reqId) { action(); lastTime = performance.now(); reqId = requestAnimationFrame(loop); }
                };
                const stop = (e) => {
                    if (e && e.type === 'touchend' && e.cancelable) e.preventDefault();
                    if (reqId) { cancelAnimationFrame(reqId); reqId = null; }
                };
                
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', stop);
                btn.addEventListener('mouseleave', stop);
                btn.addEventListener('touchstart', start, {passive: false});
                btn.addEventListener('touchend', stop, {passive: false});
                btn.addEventListener('touchcancel', stop, {passive: false});
            }

            addHoldListener('btnUp', () => { imgCenter.lat += (imgHeightLat * 0.01); updateOverlay(); });
            addHoldListener('btnDown', () => { imgCenter.lat -= (imgHeightLat * 0.01); updateOverlay(); });
            addHoldListener('btnLeft', () => { imgCenter.lng -= (imgWidthLng * 0.01); updateOverlay(); });
            addHoldListener('btnRight', () => { imgCenter.lng += (imgWidthLng * 0.01); updateOverlay(); });
            addHoldListener('btnScaleUp', () => { imgWidthLng *= 1.02; imgHeightLat *= 1.02; updateOverlay(); });
            addHoldListener('btnScaleDown', () => { imgWidthLng *= 0.98; imgHeightLat *= 0.98; updateOverlay(); });
            addHoldListener('btnRotLeft', () => { imgRotation -= 1; updateOverlay(); });
            addHoldListener('btnRotRight', () => { imgRotation += 1; updateOverlay(); });

            ui.opacitySlider.addEventListener('input', (e) => {
                ui.opacityVal.innerText = e.target.value + '%';
                if (imageOverlay) imageOverlay.setOpacity(e.target.value / 100);
            });

            ui.removeOverlayBtn.addEventListener('click', () => {
                if (imageOverlay) map.removeLayer(imageOverlay);
                imageOverlay = null;
                ui.overlayControls.classList.add('hidden');
            });

            // --- 5. MAP INTERACTIONS ---
            map.on('click', function(e) {
                if (isPlacingImage) {
                    isPlacingImage = false;
                    ui.mapInstructionOverlay.classList.add('hidden');
                    ui.mapEl.classList.remove('drawing-cursor');
                    imgCenter = e.latlng;
                    imgRotation = 0;
                    
                    const aspect = calImgObj.naturalWidth / calImgObj.naturalHeight;
                    const mapBounds = map.getBounds();
                    imgWidthLng = (mapBounds.getEast() - mapBounds.getWest()) * 0.3; 
                    imgHeightLat = (imgWidthLng * Math.cos(imgCenter.lat * Math.PI / 180)) / aspect;
                    
                    if (imageOverlay) map.removeLayer(imageOverlay);
                    
                    const opacity = ui.opacitySlider.value / 100;
                    imageOverlay = new L.RotatedImageOverlay(calImgObj.src, [[0,0],[0,0]], { opacity, interactive: false, angle: 0 }).addTo(map);
                    updateOverlay();
                    ui.overlayControls.classList.remove('hidden');
                    
                } else if (isDrawing) {
                    trailCoords.push(e.latlng);
                    trailPolyline.addLatLng(e.latlng);
                    L.circleMarker(e.latlng, { radius: 4, fillColor: "#fff", color: "#f00", weight: 2, interactive: false }).addTo(pointMarkers);
                    updateDrawingUI();
                }
            });

            ui.drawToggleBtn.addEventListener('click', () => {
                isDrawing = !isDrawing;
                if (isDrawing) {
                    ui.drawText.innerText = 'Stop Drawing';
                    ui.drawIcon.innerHTML = '<use href="#icon-stop"></use>';
                    ui.drawToggleBtn.classList.replace('bg-blue-600', 'bg-red-600');
                    ui.drawToggleBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');
                    ui.mapEl.classList.add('drawing-cursor');
                } else {
                    ui.drawText.innerText = 'Start Drawing';
                    ui.drawIcon.innerHTML = '<use href="#icon-pen"></use>';
                    ui.drawToggleBtn.classList.replace('bg-red-600', 'bg-blue-600');
                    ui.drawToggleBtn.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
                    ui.mapEl.classList.remove('drawing-cursor');
                }
            });

            ui.undoBtn.addEventListener('click', () => {
                trailCoords.pop();
                trailPolyline.setLatLngs(trailCoords);
                pointMarkers.clearLayers();
                // Because renderer is L.canvas, batch-adding markers is highly efficient
                trailCoords.forEach(c => L.circleMarker(c, { radius: 4, fillColor: "#fff", color: "#f00", weight: 2, interactive: false }).addTo(pointMarkers));
                updateDrawingUI();
            });

            ui.clearTrailBtn.addEventListener('click', () => {
                if(confirm("Clear entire trail?")) {
                    trailCoords = []; trailPolyline.setLatLngs([]); pointMarkers.clearLayers(); updateDrawingUI();
                }
            });

            function updateDrawingUI() {
                ui.pointCountTxt.innerText = `${trailCoords.length} points drawn`;
                const hasPoints = trailCoords.length > 0;
                ui.undoBtn.disabled = !hasPoints; ui.clearTrailBtn.disabled = !hasPoints;
                ui.exportGpxBtn.disabled = !hasPoints; ui.exportKmlBtn.disabled = !hasPoints;
            }

            // --- 6. EXPORTS ---
            function downloadFile(content, filename, contentType) {
                const blob = new Blob([content], { type: contentType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            }

            ui.exportGpxBtn.addEventListener('click', () => {
                let gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" xmlns="http://www.topografix.com/GPX/1/1"><trk><trkseg>';
                trailCoords.forEach(c => gpx += `<trkpt lat="${c.lat.toFixed(6)}" lon="${c.lng.toFixed(6)}"></trkpt>`);
                gpx += '</trkseg></trk></gpx>';
                downloadFile(gpx, 'trail.gpx', 'application/gpx+xml');
            });

            ui.exportKmlBtn.addEventListener('click', () => {
                let kml = '<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><Placemark><LineString><coordinates>';
                trailCoords.forEach(c => kml += `${c.lng.toFixed(6)},${c.lat.toFixed(6)},0 `);
                kml += '</coordinates></LineString></Placemark></Document></kml>';
                downloadFile(kml, 'trail.kml', 'application/vnd.google-earth.kml+xml');
            });

            // --- 7. LOCATION TRACKING (Zero Garbage Collection) ---
            ui.locateBtn.addEventListener('click', () => {
                if (!isTracking) {
                    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                        showAlert("GPS requires HTTPS. Android browsers block location on local file:// paths.");
                        return;
                    }
                    map.locate({setView: false, watch: true, enableHighAccuracy: true});
                    ui.locateBtn.classList.replace('text-gray-700', 'text-blue-600');
                    ui.locateBtn.classList.add('bg-blue-50');
                    isTracking = true;
                } else {
                    map.stopLocate();
                    if (userMarker) map.removeLayer(userMarker);
                    if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);
                    userMarker = null; userAccuracyCircle = null;
                    ui.locateBtn.classList.replace('text-blue-600', 'text-gray-700');
                    ui.locateBtn.classList.remove('bg-blue-50');
                    isTracking = false;
                }
            });

            map.on('locationfound', function(e) {
                if (!userMarker) {
                    // Create once
                    const iconHtml = `<div class="user-location-pulse"></div><div id="userHeading" class="user-location-heading" style="display:none;"></div><div class="user-location-dot"></div>`;
                    const icon = L.divIcon({ className: 'user-location-marker', html: iconHtml, iconSize: [30, 30], iconAnchor: [15, 15] });
                    map.flyTo(e.latlng, Math.max(map.getZoom(), 16));
                    userMarker = L.marker(e.latlng, {icon, interactive: false, zIndexOffset: 1000}).addTo(map);
                    userAccuracyCircle = L.circle(e.latlng, {radius: e.accuracy/2, color: '#4285F4', fillOpacity: 0.15, interactive: false}).addTo(map);
                } else {
                    // Update exact properties directly to avoid Garbage Collection
                    userMarker.setLatLng(e.latlng);
                    userAccuracyCircle.setLatLng(e.latlng);
                    userAccuracyCircle.setRadius(e.accuracy/2);
                    
                    const headingEl = document.getElementById('userHeading');
                    if (headingEl) {
                        if (e.heading !== null && !isNaN(e.heading)) {
                            headingEl.style.display = 'block';
                            headingEl.style.transform = `translateX(-50%) rotate(${e.heading}deg)`;
                        } else {
                            headingEl.style.display = 'none';
                        }
                    }
                }
            });

            map.on('locationerror', function(e) {
                showAlert("Could not access location. Ensure you are on HTTPS and permissions are granted.");
                if (isTracking) ui.locateBtn.click();
            });

            // Sidebar UI Logic
            document.getElementById('sidebarHandle').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('collapsed');
                setTimeout(() => { map.invalidateSize(); }, 350);
            });
        };
    </script>
</body>
</html>
